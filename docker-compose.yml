services:

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    env_file:
      - ./backend/.env

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot_db

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot_db"]
      interval: 3s
      timeout: 3s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: celery -A app.workers.tasks worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: